<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Referans Rentecar</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; background-color: #ffffff; overflow-x: hidden; font-family: 'Montserrat', sans-serif; }
        
        /* Neon Yazı Renk Geçiş Animasyonu */
        .neon-text {
            animation: neonFlow 2s infinite alternate linear;
        }
        @keyframes neonFlow {
            0% { fill: #FFE082; filter: drop-shadow(0 0 8px rgba(255, 193, 7, 0.6)); }
            50% { fill: #FFCA28; filter: drop-shadow(0 0 12px rgba(255, 179, 0, 0.8)); }
            100% { fill: #FF8F00; filter: drop-shadow(0 0 16px rgba(255, 143, 0, 1)); }
        }

        /* Geçişler */
        #header-elements, .ai-trigger, #digital-assistant-modal, #ai-avatar-group {
            transition: all 0.5s ease-in-out;
        }
        .ai-trigger, #close-modal { cursor: pointer; }

        /* Asistan Açıldığında Üst Menüyü ve Çubuğu Gizleme Sınıfları */
        .fade-out-up { opacity: 0; transform: translateY(-30px); pointer-events: none; }
        .fade-out { opacity: 0; pointer-events: none; }
        
        /* Modal Başlangıç (Sağ Altta Gizli) */
        .modal-hidden { opacity: 0; pointer-events: none; transform: translate(1450px, 1000px) scale(0.9); }
        /* Modal Aktif (Sağ Altta Görünür) */
        .modal-visible { opacity: 1; pointer-events: auto; transform: translate(1450px, 820px) scale(1); }
        
        /* Avatar Uçuş (Sağ Alta) */
        .avatar-move { transform: translate(950px, 500px) scale(0.5); opacity: 0; }
        
        .ai-pulse { animation: pulse 2s infinite alternate; }
        @keyframes pulse {
            0% { filter: drop-shadow(0 0 10px rgba(255, 193, 7, 0.3)); }
            100% { filter: drop-shadow(0 0 25px rgba(255, 193, 7, 0.8)); }
        }
    </style>
</head>
<body>

<svg width="1920" height="1500" viewBox="0 0 1920 1500" fill="#ffffff" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="shadow-md" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.06"/>
        </filter>
        <filter id="shadow-sm" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
        </filter>
        <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FFB300" />
            <stop offset="50%" stop-color="#FFD54F" />
            <stop offset="100%" stop-color="#FF8F00" />
        </linearGradient>
    </defs>

    <rect width="1920" height="1500" fill="#ffffff"/>

    <!-- ========================================== -->
    <!-- SOL ÜST: LOGO VE PWA KUTUSU                -->
    <!-- ========================================== -->
    <g transform="translate(100, 80)">
        <text x="0" y="0" font-size="32" font-weight="900" fill="#1A1D20" letter-spacing="-1">REFERANS<tspan fill="#FFC107">.</tspan></text>
        
        <g transform="translate(-10, 40)">
            <rect width="260" height="240" rx="16" fill="#ffffff" filter="url(#shadow-sm)" stroke="#E9ECEF" stroke-width="1.5"/>
            
            <rect x="100" y="25" width="60" height="70" rx="8" fill="#FFC107" />
            <rect x="110" y="35" width="40" height="50" rx="4" fill="#ffffff" />
            <path d="M130 45 L130 65 M120 55 L130 65 L140 55" stroke="#FFC107" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            
            <text x="130" y="130" font-size="18" font-weight="900" fill="#1A1D20" text-anchor="middle">Ana Ekrana Ekle</text>
            <text x="130" y="155" font-size="12" font-weight="600" fill="#6C757D" text-anchor="middle">Kampanyalar ve İndirimleri</text>
            <text x="130" y="175" font-size="12" font-weight="600" fill="#6C757D" text-anchor="middle">kaçırmayın.</text>
            
            <rect x="30" y="195" width="200" height="40" rx="8" fill="#FFC107" />
            <text x="130" y="221" font-size="14" font-weight="900" fill="#1A1D20" text-anchor="middle">HEMEN YÜKLE</text>
        </g>
    </g>

    <!-- ========================================== -->
    <!-- ÜST MENÜ: NEON VE YAKINLAŞTIRILMIŞ YAP     -->
    <!-- ========================================== -->
    <g id="header-elements" transform="translate(0, 80)">
        <text x="960" y="0" font-size="28" font-weight="900" class="neon-text" text-anchor="middle" letter-spacing="0.5">Arabanı Sipariş Ver!</text>

        <circle cx="680" cy="-7" r="6" fill="#00E676"/>
        <text x="695" y="-2" font-size="15" font-weight="700" fill="#1A1D20">Şu Anda Açığız</text>

        <text x="1225" y="-2" font-size="15" font-weight="700" fill="#1A1D20" text-anchor="end">Anında Adrese Ücretsiz Teslimat</text>
        <circle cx="1240" cy="-7" r="6" fill="#D32F2F"/>
    </g>

    <!-- ========================================== -->
    <!-- YAPAY ZEKA ÇUBUĞU VE FİLTRELER             -->
    <!-- ========================================== -->
    <g transform="translate(0, 240)">
        <g id="ai-search-bar" class="ai-trigger">
            <text x="960" y="0" font-size="22" font-weight="800" fill="#1A1D20" text-anchor="middle">✨ Nasıl bir araba bakmıştınız? Lütfen seçiniz</text>
            
            <g transform="translate(0, 30)">
                <rect x="460" y="0" width="1000" height="80" rx="40" fill="#ffffff" filter="url(#shadow-md)" stroke="#FFC107" stroke-width="2"/>
                <text x="545" y="47" font-size="16" font-weight="600" fill="#6C757D">Dijital asistanınıza tarif edin veya bir seçenek belirleyin...</text>

                <rect x="1210" y="17" width="110" height="46" rx="23" fill="#F8F9FA"/>
                <text x="1265" y="45" font-size="14" font-weight="700" fill="#1A1D20" text-anchor="middle">İlan Ver</text>

                <rect x="1330" y="17" width="110" height="46" rx="23" fill="#F8F9FA"/>
                <text x="1385" y="45" font-size="14" font-weight="700" fill="#1A1D20" text-anchor="middle">Destek</text>

                <!-- Filtreler: Satır 1 (Tam 1000px hizalı) -->
                <g transform="translate(460, 110)">
                    <rect x="0" y="0" width="180" height="46" rx="23" fill="#FFC107"/>
                    <text x="90" y="28" font-size="14" font-weight="800" fill="#1A1D20" text-anchor="middle">Premium SUV</text>

                    <rect x="205" y="0" width="180" height="46" rx="23" fill="#ffffff" stroke="#DEE2E6" stroke-width="1.5"/>
                    <text x="295" y="28" font-size="14" font-weight="700" fill="#6C757D" text-anchor="middle">Spor Cabrio</text>

                    <rect x="410" y="0" width="180" height="46" rx="23" fill="#ffffff" stroke="#DEE2E6" stroke-width="1.5"/>
                    <text x="500" y="28" font-size="14" font-weight="700" fill="#6C757D" text-anchor="middle">Elektrikli</text>

                    <rect x="615" y="0" width="180" height="46" rx="23" fill="#ffffff" stroke="#DEE2E6" stroke-width="1.5"/>
                    <text x="705" y="28" font-size="14" font-weight="700" fill="#6C757D" text-anchor="middle">Hibrit</text>

                    <rect x="820" y="0" width="180" height="46" rx="23" fill="#ffffff" stroke="#DEE2E6" stroke-width="1.5"/>
                    <text x="910" y="28" font-size="14" font-weight="700" fill="#6C757D" text-anchor="middle">Geniş Aile</text>
                </g>

                <!-- Filtreler: Satır 2 (Tam Merkez Ortalandı) -->
                <g transform="translate(460, 170)">
                    <rect x="110" y="0" width="140" height="46" rx="23" fill="#ffffff" stroke="#DEE2E6" stroke-width="1.5"/>
                    <text x="180" y="28" font-size="14" font-weight="700" fill="#6C757D" text-anchor="middle">Otomatik</text>

                    <rect x="270" y="0" width="140" height="46" rx="23" fill="#ffffff" stroke="#DEE2E6" stroke-width="1.5"/>
                    <text x="340" y="28" font-size="14" font-weight="700" fill="#6C757D" text-anchor="middle">Dizel</text>

                    <rect x="430" y="0" width="140" height="46" rx="23" fill="#ffffff" stroke="#DEE2E6" stroke-width="1.5"/>
                    <text x="500" y="28" font-size="14" font-weight="700" fill="#6C757D" text-anchor="middle">VIP Minibüs</text>

                    <rect x="590" y="0" width="140" height="46" rx="23" fill="#ffffff" stroke="#DEE2E6" stroke-width="1.5"/>
                    <text x="660" y="28" font-size="14" font-weight="700" fill="#6C757D" text-anchor="middle">4x4 Pick-Up</text>

                    <rect x="750" y="0" width="140" height="46" rx="23" fill="#ffffff" stroke="#DEE2E6" stroke-width="1.5"/>
                    <text x="820" y="28" font-size="14" font-weight="700" fill="#6C757D" text-anchor="middle">Lüks Sedan</text>
                </g>
            </g>
        </g>

        <!-- Avatar -->
        <g id="ai-avatar-group" class="ai-trigger" transform="translate(0, 30)">
            <g class="ai-pulse">
                <circle cx="460" cy="40" r="48" fill="none" stroke="#FFC107" stroke-width="3" stroke-dasharray="10, 5"/>
                <circle cx="460" cy="40" r="40" fill="#1A1D20" filter="url(#shadow-md)"/>
                <text x="460" y="52" font-size="32" text-anchor="middle">🐆</text>
            </g>
        </g>
    </g>

    <!-- ========================================== -->
    <!-- ARAÇLAR (KESİNLİKLE SABİT, ÇERÇEVESİZ, EŞİT)-->
    <!-- ========================================== -->
    <!-- SOL ARAÇ (MERCEDES) -->
    <g transform="translate(250, 720) scale(1.2)">
        <path d="M120 180 L160 80 L350 80 L400 130 L480 140 L500 200 L500 280 L120 280 Z" fill="none" stroke="#E9ECEF" stroke-width="3"/>
        <circle cx="200" cy="280" r="45" fill="#1A1D20"/>
        <circle cx="420" cy="280" r="45" fill="#1A1D20"/>
        
        <rect x="170" y="340" width="300" height="40" rx="20" fill="#F8F9FA" stroke="#E9ECEF"/>
        <text x="320" y="366" font-size="14" font-weight="700" fill="#1A1D20" text-anchor="middle">← 360° İncelemek İçin Kaydırın →</text>

        <text x="320" y="440" font-size="28" font-weight="900" fill="#1A1D20" text-anchor="middle" letter-spacing="1">MERCEDES G-CLASS</text>
        <text x="320" y="490" font-size="42" font-weight="900" fill="#1A1D20" text-anchor="middle">4.500 ₺ <tspan font-size="20" fill="#6C757D">/ Gün</tspan></text>

        <g transform="translate(130, 520)">
            <g transform="translate(0,0)">
                <rect x="0" y="-5" width="28" height="28" rx="8" fill="#FFF8E1"/>
                <text x="35" y="14" font-size="14" font-weight="700" fill="#1A1D20">Benzin</text>
            </g>
            <g transform="translate(110,0)">
                <rect x="0" y="-5" width="28" height="28" rx="8" fill="#FFF8E1"/>
                <text x="35" y="14" font-size="14" font-weight="700" fill="#1A1D20">Otomatik</text>
            </g>
            <g transform="translate(235,0)">
                <rect x="0" y="-5" width="28" height="28" rx="8" fill="#FFF8E1"/>
                <text x="35" y="14" font-size="14" font-weight="700" fill="#1A1D20">5 Kişi</text>
            </g>
        </g>
    </g>

    <!-- SAĞ ARAÇ (BMW) -->
    <g transform="translate(1050, 720) scale(1.2)">
        <path d="M120 180 L160 80 L350 80 L400 130 L480 140 L500 200 L500 280 L120 280 Z" fill="none" stroke="#E9ECEF" stroke-width="3" transform="scale(-1, 1) translate(-620, 0)"/>
        <circle cx="200" cy="280" r="45" fill="#1A1D20"/>
        <circle cx="420" cy="280" r="45" fill="#1A1D20"/>
        
        <rect x="170" y="340" width="300" height="40" rx="20" fill="#F8F9FA" stroke="#E9ECEF"/>
        <text x="320" y="366" font-size="14" font-weight="700" fill="#1A1D20" text-anchor="middle">← 360° İncelemek İçin Kaydırın →</text>
        
        <text x="320" y="440" font-size="28" font-weight="900" fill="#1A1D20" text-anchor="middle" letter-spacing="1">BMW 520i</text>
        <text x="320" y="490" font-size="42" font-weight="900" fill="#1A1D20" text-anchor="middle">3.800 ₺ <tspan font-size="20" fill="#6C757D">/ Gün</tspan></text>
        
        <g transform="translate(130, 520)">
            <g transform="translate(0,0)">
                <rect x="0" y="-5" width="28" height="28" rx="8" fill="#FFF8E1"/>
                <text x="35" y="14" font-size="14" font-weight="700" fill="#1A1D20">Benzin</text>
            </g>
            <g transform="translate(110,0)">
                <rect x="0" y="-5" width="28" height="28" rx="8" fill="#FFF8E1"/>
                <text x="35" y="14" font-size="14" font-weight="700" fill="#1A1D20">Otomatik</text>
            </g>
            <g transform="translate(235,0)">
                <rect x="0" y="-5" width="28" height="28" rx="8" fill="#FFF8E1"/>
                <text x="35" y="14" font-size="14" font-weight="700" fill="#1A1D20">5 Kişi</text>
            </g>
        </g>
    </g>

    <!-- ========================================== -->
    <!-- DİJİTAL ASİSTAN MODALI (SAĞ ALTTA)         -->
    <!-- ========================================== -->
    <g id="digital-assistant-modal" class="modal-hidden">
        <rect x="0" y="0" width="420" height="580" rx="24" fill="#ffffff" filter="url(#shadow-md)"/>
        
        <path d="M0 24 Q0 0 24 0 L396 0 Q420 0 420 24 L420 120 L0 120 Z" fill="#1A1D20"/>
        <text x="210" y="55" font-size="22" font-weight="900" fill="#FFC107" text-anchor="middle">Dijital Asistan</text>
        <text x="210" y="85" font-size="14" font-weight="600" fill="#F8F9FA" text-anchor="middle">Size nasıl yardımcı olabilirim?</text>
        
        <g id="close-modal">
            <rect x="365" y="20" width="40" height="40" fill="transparent"/>
            <path d="M380 30 L395 45 M395 30 L380 45" stroke="#F8F9FA" stroke-width="2" stroke-linecap="round"/>
        </g>

        <circle cx="55" cy="180" r="28" fill="#F8F9FA" stroke="#FFC107" stroke-width="2"/>
        <text x="55" y="190" font-size="28" text-anchor="middle">🐆</text>
        
        <rect x="100" y="155" width="290" height="54" rx="16" fill="#F8F9FA"/>
        <text x="120" y="187" font-size="14" font-weight="700" fill="#1A1D20">Merhaba! Ben Referans Jaguar 🐆</text>

        <rect x="30" y="250" width="360" height="56" rx="16" fill="#ffffff" stroke="#FFC107" stroke-width="1.5"/>
        <text x="50" y="284" font-size="15" font-weight="700" fill="#1A1D20">💰 Kiralama Ücretleri Ne Kadar?</text>

        <rect x="30" y="325" width="360" height="56" rx="16" fill="#ffffff" stroke="#FFC107" stroke-width="1.5"/>
        <text x="50" y="359" font-size="15" font-weight="700" fill="#1A1D20">📸 Araç Görsellerini Görebilir miyiz?</text>

        <rect x="30" y="400" width="360" height="56" rx="16" fill="#ffffff" stroke="#FFC107" stroke-width="1.5"/>
        <text x="50" y="434" font-size="15" font-weight="700" fill="#1A1D20">❓ Aklıma Takılan Başka Bir Soru Var</text>

        <path d="M0 520 L420 520" stroke="#F8F9FA" stroke-width="2"/>
        <text x="210" y="555" font-size="12" font-weight="700" fill="#6C757D" text-anchor="middle">⚡ Powered by Referans Rentecar</text>
    </g>
</svg>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const triggers = document.querySelectorAll('.ai-trigger');
        const aiAvatarGroup = document.getElementById('ai-avatar-group');
        const headerElements = document.getElementById('header-elements');
        const modal = document.getElementById('digital-assistant-modal');
        const closeBtn = document.getElementById('close-modal');
        
        function openDigitalAssistant() {
            headerElements.classList.add('fade-out-up');
            triggers.forEach(t => t.classList.add('fade-out'));
            aiAvatarGroup.classList.add('avatar-move');
            
            modal.classList.remove('modal-hidden');
            modal.classList.add('modal-visible');
        }

        function closeDigitalAssistant() {
            headerElements.classList.remove('fade-out-up');
            triggers.forEach(t => t.classList.remove('fade-out'));
            aiAvatarGroup.classList.remove('avatar-move');
            
            modal.classList.remove('modal-visible');
            modal.classList.add('modal-hidden');
        }

        triggers.forEach(t => t.addEventListener('click', openDigitalAssistant));
        if(closeBtn) closeBtn.addEventListener('click', closeDigitalAssistant);
    });
</script>
</body>
</html>
