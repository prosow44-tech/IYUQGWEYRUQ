<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renecar Tasarım Seçimi</title>
<style>
    /* 1. RESET VE TEMEL AYARLAR */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body, html {
        background-color: #ffffff;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }
    
    /* 2. DEVASA TUVAL */
    .canvas {
        position: relative;
        width: 96vw;
        height: 96vh;
        margin: 2vh auto;
        background-color: #ffffff;
    }
    
    /* 3. MİNİMALİST SVG OKLARI */
    svg.arrows {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
    }
    path.line {
        fill: none;
        stroke: #FFC107; /* Zarif Sarı */
        stroke-width: 2px; /* Çok daha ince ve minimalist */
        stroke-dasharray: 6, 8; /* Daha sık ve estetik kesik çizgiler */
        animation: highwayMove 0.8s linear infinite;
    }
    @keyframes highwayMove { to { stroke-dashoffset: -14; } }

    /* 4. ORTAK KUTU TAŞIYICISI (Boyutlar devasa %43) */
    .box-wrapper {
        position: absolute;
        width: 43%; /* Ekranın %86'sını kutular kaplayacak */
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 2;
    }
    
    .tl { top: 0%; left: 0%; }
    .tr { top: 0%; right: 0%; }
    .bl { bottom: 0%; left: 0%; }
    .br { bottom: 0%; right: 0%; }

    /* Sabit Yazılar */
    .text-top {
        font-size: 16px;
        color: #1A1D20;
        font-weight: 800;
        margin-bottom: 15px;
    }
    .text-bottom {
        font-size: 26px;
        color: #1A1D20;
        font-weight: 900;
        margin-top: 15px;
    }

    /* Ortak Video Kutu Özelliği */
    .box {
        width: 100%;
        aspect-ratio: 16 / 9; /* Tam 1920x1080 oranı */
        background-color: #000000;
        position: relative;
        cursor: pointer;
        transition: transform 0.2s ease;
        /* DİKKAT: overflow: hidden KALDIRILDI. Rozetler artık kesilmeyecek. */
    }
    .box:hover { transform: scale(1.02); }
    .box video {
        width: 100%; height: 100%; object-fit: cover; pointer-events: none;
    }

    /* ROZET ORTAK (Kırpılma sorunu çözüldü) */
    .click-badge {
        position: absolute;
        padding: 6px 18px;
        font-size: 12px;
        font-weight: 900;
        color: #ffffff;
        display: flex;
        align-items: center;
        gap: 6px;
        z-index: 10;
        pointer-events: none;
    }
    .click-badge::before {
        content: ''; width: 8px; height: 8px; background-color: #ffffff; border-radius: 50%; display: inline-block; animation: blinkDot 1.5s infinite;
    }
    @keyframes blinkDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }


    /* =========================================
       FARKLI TASARIM SEÇENEKLERİ (Lütfen Seç)
       ========================================= */

    /* SEÇENEK 1: SOL ÜST (Klasik Katı Gölge - Düzeltilmiş) */
    .opt-1 .box { border-radius: 20px; box-shadow: -15px -15px 0px 0px #E5E5E5; }
    .opt-1 .box video { border-radius: 20px; }
    .opt-1 .click-badge { top: -16px; left: -12px; background: #ff3b30; border-radius: 25px; box-shadow: 0 4px 10px rgba(255, 59, 48, 0.4); }

    /* SEÇENEK 2: SAĞ ÜST (Premium Yumuşak Gölge) */
    .opt-2 .box { border-radius: 30px; box-shadow: 0 30px 60px -15px rgba(0,0,0,0.4); }
    .opt-2 .box video { border-radius: 30px; }
    /* Rozet kutudan bağımsız yüzüyor */
    .opt-2 .click-badge { top: -25px; right: 10px; background: #007aff; border-radius: 8px; box-shadow: 0 10px 20px rgba(0, 122, 255, 0.4); }

    /* SEÇENEK 3: SOL ALT (Zarif Çerçeveli) */
    .opt-3 .box { border-radius: 12px; border: 6px solid #F1F3F5; box-shadow: -10px -10px 0px 0px #E9ECEF; background-color: #111; }
    .opt-3 .box video { border-radius: 6px; }
    /* Rozet kurdele gibi kutunun içine hizalı */
    .opt-3 .click-badge { top: 0px; left: 0px; background: #ff3b30; border-radius: 0 0 15px 0; }

    /* SEÇENEK 4: SAĞ ALT (Ultra Minimalist - Gölgesiz) */
    .opt-4 .box { border-radius: 16px; box-shadow: none; border: 1px solid #E5E5E5; }
    .opt-4 .box video { border-radius: 16px; }
    /* Rozet çok şık siyah/beyaz kontrastında */
    .opt-4 .click-badge { top: -15px; right: -15px; background: #000000; border: 2px solid #ffffff; color: #FFC107; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .opt-4 .click-badge::before { background-color: #FFC107; }

    /* 5. MERKEZ ALAN */
    .center-area {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 12%; /* Kutular çok büyüdüğü için merkeze %12 kaldı */
        z-index: 3;
    }
    .center-area img { width: 100%; height: auto; object-fit: contain; }
    .center-text {
        margin-top: 10px; font-size: 14px; font-weight: 900; color: #000;
        text-align: center; line-height: 1.3; background-color: #ffffff; padding: 4px 8px;
    }
</style>
</head>
<body>

<div class="canvas">
    
    <!-- MİNİMALİST OKLAR (% Yüzdelik Oranlarla Çizildi, Her Ekranda Kusursuz) -->
    <svg class="arrows" viewBox="0 0 100 100" preserveAspectRatio="none">
        <path class="line" d="M 21.5 45 L 21.5 50 L 44 50" />
        <path class="line" d="M 78.5 45 L 78.5 50 L 56 50" />
        
        <path class="line" d="M 21.5 95 L 21.5 98 L 48 98 L 48 58" />
        <path class="line" d="M 78.5 95 L 78.5 98 L 52 98 L 52 58" />
    </svg>

    <!-- SEÇENEK 1: SOL ÜST (Klasik Katı Gölge) -->
    <div class="box-wrapper tl opt-1">
        <div class="text-top">Detayı İncelemek İçin Tıkla</div>
        <div class="box">
            <div class="click-badge">SEÇENEK 1</div>
            <video src="gold_jaguar.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="text-bottom">Klasik Renecar</div>
    </div>
    
    <!-- SEÇENEK 2: SAĞ ÜST (Premium Yumuşak Gölge) -->
    <div class="box-wrapper tr opt-2">
        <div class="text-top">Detayı İncelemek İçin Tıkla</div>
        <div class="box">
            <div class="click-badge">SEÇENEK 2</div>
            <video src="gold_jaguar.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="text-bottom">Premium Yumuşak</div>
    </div>
    
    <!-- SEÇENEK 3: SOL ALT (Zarif Çerçeveli) -->
    <div class="box-wrapper bl opt-3">
        <div class="text-top">Detayı İncelemek İçin Tıkla</div>
        <div class="box">
            <div class="click-badge">SEÇENEK 3</div>
            <video src="jaguar.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="text-bottom">Zarif Çerçeve</div>
    </div>
    
    <!-- SEÇENEK 4: SAĞ ALT (Ultra Minimalist) -->
    <div class="box-wrapper br opt-4">
        <div class="text-top">Detayı İncelemek İçin Tıkla</div>
        <div class="box">
            <div class="click-badge">SEÇENEK 4</div>
            <video src="jaguar.mp4" autoplay loop muted playsinline></video>
        </div>
        <div class="text-bottom">Ultra Minimalist</div>
    </div>

    <!-- MERKEZ -->
    <div class="center-area">
        <img src="panter.png" alt="Panter">
        <div class="center-text">Premium Sekment<br>Araçlar</div>
    </div>
</div>

</body>
</html>
